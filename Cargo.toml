[package]
name = "ClipSyncer"
version = "0.1.0"
edition = "2024"
authors = ["GamingChelsea"]
description = "Synchronizes clip folders and uploads to YouTube automatically"

[package.metadata.wix]
eula = false

[dependencies]
bytes = "1.11.1"
google-youtube3 = "7.0.0"
http-body-util = "0.1.3"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls-no-provider"] }
tokio = { version = "1.52.3", features = ["full"] }
yup-oauth2 = { version = "12.1.2", default-features = false, features = ["hyper-rustls"] }
rustls = { version = "0.23.40", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.228", features = ["derive"] }
ffmpeg-sidecar = "2.5.2"
tray-icon = "0.24.0"
crossbeam-channel = "0.5.15"
image = "0.25.10"
slint = { version = "1.16", features = ["unstable-winit-030"] }
rfd = "0.17.2"
ron = "0.12.1"
tempfile = "3.27.0"
chrono = "0.4.45"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde_json = "1.0.150"
webbrowser = "1.2.1"
notify-rust = "4.18.0"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[build-dependencies]
slint-build = "1.16"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"
