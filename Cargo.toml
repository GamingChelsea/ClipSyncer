[package]
name = "ClipSyncer"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.11.1"
google-youtube3 = "7.0.0"
http-body-util = "0.1.3"
reqwest = "0.13.4"
tokio = { version = "1.52.3", features = ["full"] }
yup-oauth2 = "12.1.2"
rustls = { version = "0.23.40", features = ["aws-lc-rs"] }
serde = { version = "1.0.228", features = ["derive"] }
ffmpeg-sidecar = "2.5.2"
tray-icon = "0.24.0"
crossbeam-channel = "0.5.15"
image = "0.25.10"
slint = { version = "1.16", features = ["unstable-winit-030"] }
rfd = "0.17.2"
ron = "0.12.1"
tempfile = "3.27.0"
chrono = "0.4.45"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
serde_json = "1.0.150"

[build-dependencies]
slint-build = "1.16"
