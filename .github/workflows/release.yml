name: Release Build

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (MSI & EXE)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Extract Version from Cargo.toml
        id: get_version
        shell: pwsh
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          if (-not $ver) { $ver = "0.1.0" }
          Write-Host "Detected Version: $ver"
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT

      - name: Build Release Binary
        run: cargo build --release

      - name: Build MSI Installer with WiX
        shell: pwsh
        run: |
          $ver = "${{ steps.get_version.outputs.VERSION }}"
          New-Item -ItemType Directory -Force -Path target\wix

          $wixBin = $null
          if (Get-Command "candle.exe" -ErrorAction SilentlyContinue) {
            $wixBin = Split-Path (Get-Command "candle.exe").Source
          } elseif (Test-Path ".\wix314\candle.exe") {
            $wixBin = (Resolve-Path ".\wix314").Path
          } else {
            $candidates = @(
              "C:\Program Files (x86)\WiX Toolset v3.14\bin",
              "C:\Program Files (x86)\WiX Toolset v3.11\bin",
              "C:\Program Files\WiX Toolset v3.14\bin",
              "C:\Program Files\WiX Toolset v3.11\bin",
              "C:\ProgramData\chocolatey\lib\wixtoolset\tools",
              "C:\ProgramData\chocolatey\bin"
            )
            foreach ($c in $candidates) {
              if (Test-Path "$c\candle.exe") {
                $wixBin = $c
                break
              }
            }
            if (-not $wixBin) {
              choco install wixtoolset -y --force
              foreach ($c in $candidates) {
                if (Test-Path "$c\candle.exe") {
                  $wixBin = $c
                  break
                }
              }
            }
          }

          Write-Host "Using WiX Toolset from: $wixBin"
          & "$wixBin\candle.exe" -arch x64 "-dCargoTargetBinDir=target\release" "-dVersion=$ver" -ext "$wixBin\WixUIExtension.dll" -ext "$wixBin\WixUtilExtension.dll" -out target\wix\main.wixobj wix\main.wxs
          & "$wixBin\light.exe" -ext "$wixBin\WixUIExtension.dll" -ext "$wixBin\WixUtilExtension.dll" -out "target\wix\ClipSyncer-$ver-x86_64.msi" target\wix\main.wixobj

      - name: Package Standalone Portable Zip
        shell: pwsh
        run: |
          $ver = "${{ steps.get_version.outputs.VERSION }}"
          New-Item -ItemType Directory -Force -Path target\portable
          Copy-Item target\release\ClipSyncer.exe target\portable\
          Compress-Archive -Path target\portable\* -DestinationPath "target\wix\ClipSyncer-$ver-windows-x86_64.zip"

      - name: Save Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ClipSyncer-windows
          path: |
            target/wix/ClipSyncer-*.msi
            target/wix/ClipSyncer-*.zip

  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglib2.0-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libfontconfig1-dev libfreetype6-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libasound2-dev libssl-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Extract Version from Cargo.toml
        id: get_version
        run: |
          VERSION=$(grep '^version =' Cargo.toml | head -n1 | cut -d '"' -f2)
          if [ -z "$VERSION" ]; then VERSION="0.1.0"; fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Release Binary
        run: cargo build --release

      - name: Package Linux Tarball
        run: |
          VER="${{ steps.get_version.outputs.VERSION }}"
          mkdir -p target/dist
          cp target/release/ClipSyncer target/dist/
          cd target/dist
          tar -czvf "../ClipSyncer-${VER}-linux-x86_64.tar.gz" ClipSyncer
          cd ../..

      - name: Save Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ClipSyncer-linux
          path: target/ClipSyncer-*-linux-x86_64.tar.gz

  build-macos:
    name: Build macOS (Apple Silicon)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Extract Version from Cargo.toml
        id: get_version
        run: |
          VERSION=$(grep '^version =' Cargo.toml | head -n1 | cut -d '"' -f2)
          if [ -z "$VERSION" ]; then VERSION="0.1.0"; fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Release Binary
        run: cargo build --release

      - name: Package macOS Tarball
        run: |
          VER="${{ steps.get_version.outputs.VERSION }}"
          mkdir -p target/dist
          cp target/release/ClipSyncer target/dist/
          cd target/dist
          tar -czvf "../ClipSyncer-${VER}-macos-aarch64.tar.gz" ClipSyncer
          cd ../..

      - name: Save macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ClipSyncer-macos
          path: target/ClipSyncer-*-macos-aarch64.tar.gz

  publish-release:
    name: Publish Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Version Info
        id: version_info
        run: |
          VERSION=$(grep '^version =' Cargo.toml | head -n1 | cut -d '"' -f2)
          if [ -z "$VERSION" ]; then VERSION="0.1.0"; fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${VERSION}"
          fi
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version_info.outputs.TAG }}
          VERSION: ${{ steps.version_info.outputs.VERSION }}
        run: |
          # Delete existing release & remote tag if present to reset created_at timestamp and avoid duplicate changelogs
          gh release delete "$TAG" --cleanup-tag -y || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true

          # Create a fresh release with current assets, fresh timestamp, and clean generated notes
          gh release create "$TAG" release-assets/* \
            --title "ClipSyncer v${VERSION}" \
            --generate-notes \
            --latest
